services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: authshield_keycloak
    command: start-dev --http-port 8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: AdminPassword123!
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_v2_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    networks:
      - authshield-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: authshield_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - authshield-net

  school-portal:
    build: ./portal
    container_name: authshield_portal
    ports:
      - "5000:5000"
    volumes:
      - ./portal:/app
    environment:
      FLASK_SECRET_KEY: "authshield-ultra-secure-key-999"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_BROWSER_URL: "http://localhost:8080"
      REALM_NAME: "authshield"
      CLIENT_ID: "school-portal"
      CLIENT_SECRET: "OPZkebb4uIXsrXK9dMudFXRLW6psuowD"
    depends_on:
      - keycloak
    networks:
      - authshield-net

volumes:
  keycloak_v2_data:
    driver: local

networks:
  authshield-net:
    driver: bridge
